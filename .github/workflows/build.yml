name: Build Sample Apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-ios:
    name: "iOS: Compile check"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Direct API App Switch project
        run: |
          xcodebuild \
            -project direct-api-app-switch/AppSwitchTest/AppSwitchTest.xcodeproj \
            -scheme AppSwitchTest \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            build
